# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_CACHE_SIZE: 2G
  RUSTC_WRAPPER: "sccache"

jobs:
  build-win:
    name: Build Windows Binary
    runs-on: windows-latest

    env:
      FILE_NAME: target/release/preprinttui-win-x86_64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set Up Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Cache Build Artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set Up Sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Build
        run: cargo build --release --quiet --locked

      - name: Show Sccache Stats
        run: sccache --show-stats || true

      - name: Compress Binary
        run: |
          powershell -Command "Compress-Archive -Path target/release/preprinttui.exe -DestinationPath $env:FILE_NAME"

      - name: Upload Compressed Binary to Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.FILE_NAME }}
          tag: ${{ github.ref }}
          overwrite: true

  build-unix:
    name: Build Unix Binaries (${{ matrix.suffix }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            suffix: linux-musl-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: macos-arm64

    runs-on: ${{ matrix.os }}

    env:
      FILE_NAME: target/release/preprinttui-${{ matrix.suffix }}.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set Up Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          target: ${{ matrix.target }}
          override: true

      - name: Cache Build Artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set Up Sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install musl Tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --quiet --locked --target ${{ matrix.target }}

      - name: Show Sccache Stats
        run: sccache --show-stats || true

      - name: Compress Binary
        run: |
          tar -czf "${{ env.FILE_NAME }}" \
            -C "target/${{ matrix.target }}/release" \
            preprinttui

      - name: Upload Compressed Binary to Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.FILE_NAME }}
          tag: ${{ github.ref }}
          overwrite: true

  publish:
    name: Publish Release & Package
    needs: [build-win, build-unix]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache Build Artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set Up Sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Show Sccache Stats
        run: sccache --show-stats || true

      - name: Authenticate Crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish to Crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Extract Latest Changelog
        id: changelog
        run: |
          awk '/^### v/ { if (found) exit; found=1 } found' CHANGELOG.md > latest.md
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          cat latest.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.notes }}
