# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json
version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "daily"
      time: "00:00"
      timezone: "Asia/Dhaka"
    target-branch: "main"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"

updates:
  - package-ecosystem: "cargo"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "all-dependencies"
    versioning-strategy: "increase"
    groups:
      security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "rust"

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "all-dependencies"
    groups:
      security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
    labels:
      - "dependencies"
