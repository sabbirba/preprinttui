name: Feature Idea
description: Suggest an enhancement or feature for preprinttui
title: "[Idea] "
labels:
  - enhancement
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before Submitting
      options:
        - label: I searched existing issues and discussions to avoid duplicates.
          required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What feature or enhancement do you propose?
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Motivation & Context
      description: Why would this be useful to PreConnect users or administrators?
    validations:
      required: true
