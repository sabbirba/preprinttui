name: Bug Report
description: Report a reproducible problem in preprinttui
title: "[Bug] "
labels:
  - bug
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before Submitting
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I tested the latest release or current main branch.
          required: true
        - label: This report contains no credentials, secrets, or sensitive tokens.
          required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: preprinttui Version or Commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain what failed and what you observed.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction Steps
      placeholder: |
        1. Run preprinttui with...
        2. Press key...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
